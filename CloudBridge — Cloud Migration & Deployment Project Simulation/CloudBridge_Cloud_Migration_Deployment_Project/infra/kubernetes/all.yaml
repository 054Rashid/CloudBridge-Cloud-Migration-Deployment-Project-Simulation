apiVersion: v1
kind: Namespace
metadata:
  name: cloudbridge
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudbridge-api
  namespace: cloudbridge
spec:
  replicas: 2
  selector:
    matchLabels: {app: cloudbridge-api}
  template:
    metadata:
      labels: {app: cloudbridge-api}
    spec:
      containers:
        - name: api
          image: ghcr.io/your-github-user/cloudbridge-api:latest
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet: {path: /health, port: 8000}
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /health, port: 8000}
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests: {cpu: "100m", memory: "128Mi"}
            limits: {cpu: "500m", memory: "512Mi"}
---
apiVersion: v1
kind: Service
metadata:
  name: cloudbridge-api
  namespace: cloudbridge
spec:
  selector: {app: cloudbridge-api}
  ports:
    - port: 80
      targetPort: 8000
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: cloudbridge-api
  namespace: cloudbridge
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: cloudbridge-api
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
